name: check

on:
  pull_request:
    branches: [autoresearch]
  push:
    branches: [autoresearch]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      EXA: "off"
      MEMORY_BACKEND: local
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
          activate-environment: true
      - name: Install dev and viewer dependencies
        run: uv pip install -r pyproject.toml --extra dev --extra viewer
      - name: Build testcase sandbox image
        run: docker build -t caffeinated-testcases:py311-v1 -f testcases/Dockerfile testcases
      - name: make check
        run: make check PYTHON=python
