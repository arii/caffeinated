[project]
name = "autoresearch"
version = "0.1.0"
description = "Autonomous CPU benchmark research swarm"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas==2.2.3",
    "openpyxl==3.1.5",
]

[project.optional-dependencies]
tinker = [
    "tinker==0.39.0; python_version >= '3.11'",
    "tml-renderers==0.4.1; python_version >= '3.11'",
]
viewer = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
]
