[project]
name = "autoresearch"
version = "0.1.0"
description = "Artificial Scientist Swarms: research agents with a deterministic boredom meter"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas==2.2.3",
    "openpyxl==3.1.5",
]

[project.optional-dependencies]
viewer = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
]
dev = [
    "ruff==0.17.5",
    "vulture==2.16",
    "deptry==0.25.1",
]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["worktrees", ".swarm_worktrees", "runs", "results", "node_modules", "docs/backend-integration.md"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # long strings/prompts; ruff format handles code width
    "B905",   # zip(strict=) would change behavior on uneven inputs
    "RUF005", # [*a, b] vs a + [b] is style churn
    "SIM300", # misreads uppercase locals (e.g. the meter value B) as constants
    "RUF001", "RUF002", "RUF003",  # intentional unicode in prompts/docs
]

[tool.ruff.lint.per-file-ignores]
# These scripts put the repo or boredom_meter/ on sys.path before importing local modules.
"boredom.py" = ["E402"]
"testcases/**/*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["boredom", "experiments", "export_viewer", "llm", "memory", "meter", "research", "swarm", "testcases", "test_testcases", "viewer"]

[tool.vulture]
paths = [".", "vulture_whitelist.py"]
exclude = ["worktrees/", ".swarm_worktrees/", "runs/", "results/", ".venv/", "backend/", "node_modules/"]
min_confidence = 60
ignore_decorators = ["@app.get", "@app.exception_handler", "@app.middleware"]

[tool.deptry]
known_first_party = ["experiments", "meter", "testcases", "test_export_viewer", "test_testcases", "viewer"]
# testcases/ candidate and evaluator code runs inside the Docker sandbox image, whose deps live in testcases/Dockerfile.
exclude = ["testcases", "experiments/confirmatory/results", "\\.venv", "worktrees", "\\.swarm_worktrees", "backend", "node_modules", "docs/backend-integration.md"]
optional_dependencies_dev_groups = ["dev"]

[tool.deptry.per_rule_ignores]
DEP002 = [
    "httpx",     # required at test time by fastapi.testclient.TestClient
    "openpyxl",  # pandas.read_excel engine used by swarm.preview_file
]
