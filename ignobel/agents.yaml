# Four example agents. --agents N takes the first N. Add more below in the same shape.
# instruments: name -> which column of the agent's private CSV it reads.
agents:
  - name: quill
    field: behavioral economics
    seed_queries:
      - "coffee consumption and workplace productivity field study"
      - "small nudges with surprisingly large behavioral effects"
      - "weekday effects on decision making"
    dataset: data/quill_coffee.csv
    instruments:
      - {name: cups_per_hour, column: cups, description: "cups of coffee logged per hour"}
      - {name: task_minutes, column: task_minutes, description: "minutes to finish a standard task"}
      - {name: mood_rating, column: mood, description: "self-reported mood 1-7"}
    methods: [difference-in-differences, OLS regression, pre-registration, placebo tests]
    budget_per_round: 6

  - name: oyelaran
    field: acoustic ecology
    seed_queries:
      - "urban noise and bird song frequency shift"
      - "animals adjusting behaviour to human schedules"
      - "unexpected effects of traffic noise on wildlife"
    dataset: data/oyelaran_birds.csv
    instruments:
      - {name: noise_level, column: decibels, description: "ambient sound level in dB"}
      - {name: song_rate, column: song_count, description: "songs counted per 10 minutes"}
      - {name: traffic_count, column: traffic, description: "vehicles passing per 10 minutes"}
    methods: [transect survey, mixed-effects models, spectrogram analysis]
    budget_per_round: 6

  - name: ikeda
    field: food physics
    seed_queries:
      - "buttered toast falling butter side down physics"
      - "kitchen physics experiments with everyday objects"
      - "tumbling dynamics of dropped objects"
    dataset: data/ikeda_toast.csv
    instruments:
      - {name: drop_outcome, column: butter_side_down, description: "1 if toast landed butter side down"}
      - {name: crumb_density, column: crumb_density, description: "crumb density in g/cm3"}
      - {name: rotation_angle, column: rotation, description: "total rotation during fall in degrees"}
    methods: [controlled drop trials, high-speed video, dimensional analysis]
    budget_per_round: 6

  - name: volkov
    field: statistics
    seed_queries:
      - "replication crisis causes and remedies"
      - "split-half reliability and effect size inflation"
      - "garden of forking paths in data analysis"
    dataset: null
    instruments: []
    methods: [bootstrap, split-half replication, equivalence testing, pre-registration]
    budget_per_round: 0
