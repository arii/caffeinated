# Mother agents (departments). A run starts with only these: they meet and talk first, then each
# founds its own daughter labs in subfields it chooses (config.yaml: initial_daughters). Mothers do
# no research; when their daughters get bored they found more (spawn_threshold, spawn_cooldown).
# Each daughter's private dataset is generated from the instruments its mother invents; the
# daughter never sees the recipe (mean, sd, depends_on), only instrument names and descriptions.
mothers:
  - name: biology
    field: biology
  - name: chemistry
    field: chemistry
  - name: physics
    field: physics
