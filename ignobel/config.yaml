# Run-time knobs. Everything here is read once by config.load().
boredom_threshold: 0.50      # B at or above this means SNAP under boredom_policy.
                             # 0.5 = the newest idea just repeats the last ones and nothing is failing.
random_snap_prob: 0.30       # random_policy snaps with this probability, ignoring B
tell_prize: true             # whether the agent prompt mentions that a prize exists
teams_enabled: false         # teams.py is a stub; leave false
roster: families             # families = mothers (families.yaml) found daughter labs; flat = agents.yaml
spawn_threshold: 0.40        # a mother spawns a daughter when its daughters' mean B reaches this
spawn_cooldown: 2            # rounds between two spawns by the same mother
max_daughters: 5             # per mother
initial_daughters: 2         # labs each mother founds after the opening meeting
mother_talk_rounds: 2        # each mother speaks this many times in the opening meeting
wander_prob: 0.15            # chance a working daughter bumps into a random colleague each round;
                             # a bored (SNAP) daughter always wanders
alpha: 0.05                  # base significance threshold before dividing by study count
keep_similarity: 0.95        # share(): receiver drops items this similar to what it has
max_share_items: 3
talk_turns: 3
seed_results_per_query: 5
