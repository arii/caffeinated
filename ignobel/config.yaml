# Run-time knobs. Everything here is read once by config.load().
boredom_threshold: 0.50      # B at or above this means SNAP under boredom_policy.
                             # 0.5 = the newest idea just repeats the last ones and nothing is failing.
random_snap_prob: 0.30       # random_policy snaps with this probability, ignoring B
tell_prize: true             # whether the agent prompt mentions that a prize exists
teams_enabled: false         # teams.py is a stub; leave false
roster: families             # families = mothers (families.yaml) found daughter labs; flat = agents.yaml
spawn_threshold: 0.40        # a mother spawns a daughter when its daughters' mean B reaches this
spawn_cooldown: 2            # rounds between two spawns by the same mother
max_daughters: 5             # per mother
initial_daughters: 2         # labs each mother founds after the opening meeting
mother_talk_rounds: 2        # each mother speaks this many times in the opening meeting
research_steps: 2            # research steps a daughter may choose per round (papers, read, datasets, load)
first_research_passes: 2     # research passes before a new daughter's first idea (find data, then load it)
papers_per_search: 4
dataset_leads: 3             # dataset candidates returned per search
max_datasets: 2              # real datasets a daughter can hold
max_experiments: 2           # experiments a daughter may ask for when no public dataset can answer her idea
lab_after_rounds: 5          # the bench only takes an experiment whose idea has survived this many rounds:
                             # the daughter is still on the line of thought (proposal + refinements) it came from
bench: simulated             # simulated = each request is rehearsed once on placeholder numbers drawn from the
                             # daughter's own prediction (never evidence); none = requests are only listed.
                             # Real measurements returned to <run>/lab_inbox/ (or bench_inbox) are always taken in.
traceable_share: 0.5         # a study is supported only if, in each array it reported, more than this
                             # share of the values are cells of a dataset it loaded and read
wander_prob: 0.15            # chance a working daughter bumps into a random colleague each round;
                             # a bored (SNAP) daughter always wanders
alpha: 0.05                  # base significance threshold before dividing by study count
keep_similarity: 0.95        # share(): receiver drops items this similar to what it has
max_share_items: 3
talk_turns: 3
overlap_similarity: 0.8      # two daughters who meet are told when their current ideas are this similar
seed_results_per_query: 5
